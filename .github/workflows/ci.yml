name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-build-test:
    name: Monorepo Lint, Build & Security Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nextround_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-service/requirements.txt'

      - name: Install Monorepo Node Dependencies
        run: npm ci

      - name: Install AI Service Python Dependencies
        run: |
          cd apps/ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Zero ML Bypass Markers
        run: npm run check:ml-bypass

      - name: Generate Database Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nextround_db?schema=public"

      - name: Run Typecheck & Linting
        run: npm run lint

      - name: Build All Monorepo Workspaces
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nextround_db?schema=public"
          JWT_SECRET: "test-super-secret-key-32-chars-minimum-nextround"
          INTERNAL_SERVICE_SECRET: "test-internal-secret-min-32-chars-long"

      - name: Execute Express API Unit & Security Tests (Jest)
        run: npm run test --workspace=@nextround/api
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nextround_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-super-secret-key-32-chars-minimum-nextround"
          INTERNAL_SERVICE_SECRET: "test-internal-secret-min-32-chars-long"

      - name: Execute AI Service Unit Tests & Scoring Isolation Assertions (Pytest)
        run: |
          cd apps/ai-service
          python -m pytest
        env:
          GEMINI_API_KEY: "test-gemini-key"
          GROQ_API_KEY: "test-groq-key"
