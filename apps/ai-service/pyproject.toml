[project]
name = "nextround-ai-service"
version = "1.0.0"
description = "FastAPI & LangGraph AI Service for NextRound / HireOS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.50.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.7.1",
    "google-genai==2.10.0",
    "groq==1.5.0",
    "langgraph==0.2.68",
    "langchain-core==0.3.36",
    "httpx==0.28.1",
    "redis==5.2.1",
    "python-multipart==0.0.20",
    "jinja2==3.1.5",
    "fastembed==0.8.0",
    "edge-tts==7.2.8"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]

