[project]
name = "nextround-ai-service"
version = "1.0.0"
description = "FastAPI & LangGraph AI Service for NextRound / HireOS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "google-genai==2.17.0",
    "groq==1.6.0",
    "langgraph==1.2.10",
    "langchain-core==1.5.3",
    "httpx==0.28.1",
    "redis==8.1.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "fastembed==0.8.0",
    "edge-tts==7.2.8",
    "reportlab==5.0.0"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]

