<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fcfbf8" />
  <title>You're offline — HireOS</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-canvas: #fcfbf8;
      --card-bg: #ffffff;
      --card-border: rgba(212, 175, 55, 0.22);
      --text-heading: #1e1b18;
      --text-body: #6b655b;
      --text-muted: #9e978c;
      --gold-400: #f59e0b;
      --gold-500: #d97706;
      --gold-600: #b45309;
      --gold-700: #92400e;
      --gold-light: rgba(217, 119, 6, 0.08);
      --gold-glow: rgba(217, 119, 6, 0.25);
      --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html {
      height: 100%;
      background-color: var(--bg-canvas);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--bg-canvas);
      color: var(--text-body);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Circles & Orbs */
    .bg-circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .circle-1 {
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.08) 0%, rgba(245, 158, 11, 0.02) 70%, transparent 100%);
    }

    .circle-2 {
      bottom: -100px;
      right: -100px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(217, 119, 6, 0.03) 70%, transparent 100%);
    }

    .circle-ring-1 {
      top: 10%;
      right: 8%;
      width: 140px;
      height: 140px;
      border: 12px solid rgba(217, 119, 6, 0.06);
    }

    .circle-ring-2 {
      bottom: 12%;
      left: 6%;
      width: 200px;
      height: 200px;
      border: 16px solid rgba(212, 175, 55, 0.08);
    }

    /* Card Container */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 52px 40px 44px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      box-shadow: 
        0 24px 48px -12px rgba(180, 83, 9, 0.08),
        0 12px 24px -8px rgba(0, 0, 0, 0.03),
        0 2px 4px rgba(0, 0, 0, 0.02);
      text-align: center;
      animation: card-appear 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Icon Badge */
    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.1) 0%, rgba(245, 158, 11, 0.04) 100%);
      border: 1.5px solid rgba(217, 119, 6, 0.22);
      color: var(--gold-500);
      margin-bottom: 28px;
      box-shadow: 0 10px 20px -5px rgba(217, 119, 6, 0.15);
      animation: soft-pulse 3s ease-in-out infinite;
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
    }

    /* Status Pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(217, 119, 6, 0.08);
      border: 1px solid rgba(217, 119, 6, 0.2);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--gold-600);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--gold-500);
      position: relative;
    }

    .status-dot::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: var(--gold-500);
      animation: ping-dot 1.8s ease-in-out infinite;
    }

    /* Typography */
    h1 {
      color: var(--text-heading);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .description {
      font-size: 1rem;
      color: var(--text-body);
      max-width: 420px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    /* Actions */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      height: 54px;
      padding: 0 28px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-600) 100%);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px -4px rgba(217, 119, 6, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-retry:hover {
      background: linear-gradient(135deg, var(--gold-400) 0%, var(--gold-500) 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -4px rgba(217, 119, 6, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-retry:active {
      transform: translateY(0);
      box-shadow: 0 6px 16px -2px rgba(217, 119, 6, 0.35);
    }

    .btn-retry:focus-visible {
      outline: 3px solid var(--gold-glow);
      outline-offset: 3px;
    }

    .btn-retry:disabled {
      opacity: 0.8;
      cursor: not-allowed;
      transform: none;
    }

    .btn-retry svg {
      width: 20px;
      height: 20px;
    }

    .footer {
      margin-top: 36px;
      font-size: 0.775rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Keyframes */
    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes soft-pulse {
      0%, 100% {
        box-shadow: 0 10px 20px -5px rgba(217, 119, 6, 0.15);
      }
      50% {
        box-shadow: 0 14px 28px -2px rgba(217, 119, 6, 0.28);
      }
    }

    @keyframes ping-dot {
      0% { transform: scale(1); opacity: 0.8; }
      80%, 100% { transform: scale(2.2); opacity: 0; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .is-loading svg {
      animation: spin 0.9s linear infinite;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 40px 24px 32px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.65rem;
      }
      .btn-retry {
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .icon-wrapper, .status-dot::after, .is-loading svg {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Gold & Light Elements -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>
  <div class="bg-circle circle-ring-1"></div>
  <div class="bg-circle circle-ring-2"></div>

  <main class="card" role="main" aria-labelledby="offline-title">
    <!-- Gold Wi-Fi Off Icon Badge -->
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
        <path d="M5 13a10 10 0 0 1 5.24-2.76" />
        <circle cx="12" cy="20" r="1" />
      </svg>
    </div>

    <!-- Status Badge -->
    <div>
      <div class="status-badge" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">No Internet Connection</span>
      </div>
    </div>

    <h1 id="offline-title">Oops! You're offline</h1>
    <p class="description">
      Looks like you are facing a temporary network interruption. Everything is saved — check your connection and try again.
    </p>

    <!-- Single Clean Action Button -->
    <button type="button" class="btn-retry" id="retry-btn">
      <svg id="retry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
      </svg>
      <span id="retry-label">Try Again</span>
    </button>

    <p class="footer">HireOS &middot; AI-Native Hiring Platform</p>
  </main>

  <script>
    (function () {
      var btn = document.getElementById("retry-btn");
      var label = document.getElementById("retry-label");
      var statusText = document.getElementById("status-text");
      var checking = false;

      function setChecking() {
        checking = true;
        btn.disabled = true;
        btn.classList.add("is-loading");
        label.textContent = "Checking Connection...";
        statusText.textContent = "Testing Network...";
      }

      function setIdle() {
        checking = false;
        btn.disabled = false;
        btn.classList.remove("is-loading");
        label.textContent = "Try Again";
        statusText.textContent = "No Internet Connection";
      }

      function refresh() {
        window.location.reload();
      }

      btn.addEventListener("click", function () {
        if (checking) return;
        setChecking();

        if (navigator.onLine) {
          refresh();
          return;
        }

        setTimeout(function () {
          if (navigator.onLine) {
            refresh();
          } else {
            setIdle();
          }
        }, 1200);
      });

      window.addEventListener("online", refresh);
    })();
  </script>
</body>
</html>
