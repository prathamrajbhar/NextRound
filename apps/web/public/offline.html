<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>You're offline — HireOS</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-canvas: #fafafa;
      --card-bg: #ffffff;
      --card-border: #e7e5e4;
      --text-heading: #1c1917;
      --text-body: #57534e;
      --text-muted: #a8a29e;
      --gold-600: #d97706;
      --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html {
      height: 100%;
      background-color: var(--bg-canvas);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background: var(--bg-canvas);
      color: var(--text-body);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
      animation: card-appear 400ms cubic-bezier(0.16, 1, 0.3, 1) both;
      overflow: hidden;
    }

    .card-content {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      padding: 48px;
      gap: 48px;
    }

    .status-column {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card-divider {
      width: 1px;
      background-color: #f5f5f4;
      align-self: stretch;
    }

    .game-column {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Left Column Elements */
    .icon-wrapper {
      color: #78716c;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrapper svg {
      width: 44px;
      height: 44px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #f5f5f4;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #78716c;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #a8a29e;
    }

    h1 {
      color: var(--text-heading);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .description {
      font-size: 0.92rem;
      color: var(--text-body);
      max-width: 320px;
      margin: 0 auto 32px;
      line-height: 1.5;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 240px;
      height: 44px;
      border-radius: 8px;
      border: none;
      background: var(--text-heading);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-retry:hover {
      background: #2e2a27;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .btn-retry svg {
      width: 16px;
      height: 16px;
    }

    /* Right Column: Game Elements */
    .game-header {
      margin-bottom: 16px;
    }
    .game-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 4px;
    }
    .game-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .game-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 240px;
      margin-bottom: 12px;
    }

    .difficulty-selector {
      display: flex;
      gap: 12px;
    }
    .difficulty-btn {
      border: none;
      background: transparent;
      padding: 4px 0;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
      border-bottom: 2px solid transparent;
    }
    .difficulty-btn.active {
      color: var(--text-heading);
      border-bottom: 2px solid var(--text-heading);
      font-weight: 600;
    }

    .sound-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .sound-toggle:hover {
      color: var(--text-heading);
    }
    .sound-toggle svg {
      width: 16px;
      height: 16px;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 240px;
      margin-bottom: 20px;
      border-bottom: 1px solid #f5f5f4;
      padding-bottom: 12px;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-label {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .score-val {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-heading);
    }
    .score-item.player .score-val {
      color: var(--gold-600);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      width: 100%;
      max-width: 220px;
      aspect-ratio: 1;
      margin-bottom: 16px;
    }
    .cell {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      position: relative;
    }
    .cell:hover:not(:disabled) {
      background-color: #f5f5f4;
    }
    .cell:disabled {
      cursor: default;
    }
    
    /* Grid borders only inside the board */
    .cell:nth-child(3n+1), .cell:nth-child(3n+2) {
      border-right: 1px solid #e7e5e4;
    }
    .cell:nth-child(-n+6) {
      border-bottom: 1px solid #e7e5e4;
    }

    .cell.winning-cell {
      background-color: #fef08a !important; /* Soft yellow highlight */
    }

    .cell-x {
      color: var(--gold-600);
    }
    .cell-o {
      color: var(--text-heading);
    }

    .cell svg {
      width: 44%;
      height: 44%;
      stroke: currentColor;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: icon-scale-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes icon-scale-in {
      from {
        opacity: 0;
        transform: scale(0.4);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .game-status {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-body);
      margin-bottom: 12px;
      height: 16px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #e7e5e4;
      background: #ffffff;
      color: var(--text-body);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-reset:hover {
      background: #f5f5f4;
      border-color: #d6d3d1;
      color: var(--text-heading);
    }
    .btn-reset:active {
      transform: scale(0.97);
    }
    .btn-reset svg {
      width: 12px;
      height: 12px;
      transition: transform 0.3s ease;
    }
    .btn-reset:hover svg {
      transform: rotate(180deg);
    }

    .card-footer {
      background: #fafafa;
      border-top: 1px solid #f5f5f4;
      padding: 12px;
      text-align: center;
      width: 100%;
    }
    .footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      margin: 0;
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .is-loading svg {
      animation: spin 0.9s linear infinite;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .card {
        max-width: 440px;
      }
      .card-content {
        flex-direction: column;
        padding: 40px 24px;
        gap: 32px;
      }
      .card-divider {
        width: 100%;
        height: 1px;
        align-self: auto;
      }
      h1 {
        font-size: 1.5rem;
      }
      .btn-retry {
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .is-loading svg, .cell svg {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="offline-title">
    <div class="card-content">
      <!-- Left Column: Status -->
      <div class="status-column">
        <!-- Wi-Fi Off Icon -->
        <div class="icon-wrapper" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5" />
            <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84" />
            <path d="M7.34 6.34A16.85 16.85 0 0 1 12 5c2.2 0 4.3.4 6.2 1.15" />
            <path d="M1 8.5a16.94 16.94 0 0 1 2.34-1.84" />
            <circle cx="12" cy="19" r="1" />
          </svg>
        </div>

        <!-- Status Badge -->
        <div>
          <div class="status-badge" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Offline</span>
          </div>
        </div>

        <h1 id="offline-title">Oops! You're offline</h1>
        <p class="description">
          Looks like you are facing a temporary network interruption. Check your connection and try again.
        </p>

        <!-- Retry Button -->
        <button type="button" class="btn-retry" id="retry-btn">
          <svg id="retry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span id="retry-label">Try Again</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="card-divider"></div>

      <!-- Right Column: Tic-Tac-Toe Game -->
      <div class="game-column">
        <div class="game-header">
          <h2>Offline AI Match</h2>
          <p>Play while we reconnect you</p>
        </div>

        <div class="game-controls">
          <!-- Difficulty Selector -->
          <div class="difficulty-selector">
            <button type="button" class="difficulty-btn active" id="diff-easy">Novice</button>
            <button type="button" class="difficulty-btn" id="diff-hard">Expert AI</button>
          </div>

          <!-- Sound Toggle -->
          <button type="button" class="sound-toggle" id="sound-toggle" aria-label="Toggle Sound">
            <svg id="sound-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="sound-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
          <div class="score-item player" id="score-player-card">
            <span class="score-label">You (X)</span>
            <span class="score-val" id="score-player">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">Ties</span>
            <span class="score-val" id="score-ties">0</span>
          </div>
          <div class="score-item ai" id="score-ai-card">
            <span class="score-label">AI (O)</span>
            <span class="score-val" id="score-ai">0</span>
          </div>
        </div>

        <!-- Grid Board -->
        <div class="game-board" id="board">
          <button class="cell" data-index="0" aria-label="Cell 1"></button>
          <button class="cell" data-index="1" aria-label="Cell 2"></button>
          <button class="cell" data-index="2" aria-label="Cell 3"></button>
          <button class="cell" data-index="3" aria-label="Cell 4"></button>
          <button class="cell" data-index="4" aria-label="Cell 5"></button>
          <button class="cell" data-index="5" aria-label="Cell 6"></button>
          <button class="cell" data-index="6" aria-label="Cell 7"></button>
          <button class="cell" data-index="7" aria-label="Cell 8"></button>
          <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>

        <!-- Game Status Message -->
        <div class="game-status" id="game-status">Your turn (X)</div>

        <!-- Reset Button -->
        <button type="button" class="btn-reset" id="reset-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>Reset Match</span>
        </button>
      </div>
    </div>

    <!-- Footer Bar -->
    <div class="card-footer">
      <p class="footer">HireOS &middot; AI-Native Hiring Platform</p>
    </div>
  </main>

  <script>
    (function () {
      // Offline Retry Logic
      var btn = document.getElementById("retry-btn");
      var label = document.getElementById("retry-label");
      var statusText = document.getElementById("status-text");
      var checking = false;

      function setChecking() {
        checking = true;
        btn.disabled = true;
        btn.classList.add("is-loading");
        label.textContent = "Checking...";
        statusText.textContent = "Testing...";
      }

      function setIdle() {
        checking = false;
        btn.disabled = false;
        btn.classList.remove("is-loading");
        label.textContent = "Try Again";
        statusText.textContent = "Offline";
      }

      function refresh() {
        window.location.reload();
      }

      btn.addEventListener("click", function () {
        if (checking) return;
        setChecking();

        if (navigator.onLine) {
          refresh();
          return;
        }

        setTimeout(function () {
          if (navigator.onLine) {
            refresh();
          } else {
            setIdle();
          }
        }, 1200);
      });

      window.addEventListener("online", refresh);

      // Tic-Tac-Toe Game Logic
      var board = Array(9).fill(null);
      var currentPlayer = 'X'; // Player is X, AI is O
      var isGameActive = true;
      var difficulty = 'easy'; // 'easy' or 'hard'
      var soundMuted = false;
      
      var scores = {
        X: 0,
        O: 0,
        ties: 0
      };

      // Select elements
      var cells = document.querySelectorAll('.cell');
      var gameStatus = document.getElementById('game-status');
      var resetBtn = document.getElementById('reset-btn');
      var diffEasy = document.getElementById('diff-easy');
      var diffHard = document.getElementById('diff-hard');
      var soundToggle = document.getElementById('sound-toggle');
      var soundOnIcon = document.getElementById('sound-on-icon');
      var soundOffIcon = document.getElementById('sound-off-icon');
      var scorePlayerEl = document.getElementById('score-player');
      var scoreTiesEl = document.getElementById('score-ties');
      var scoreAiEl = document.getElementById('score-ai');

      // Audio setup (using Web Audio API)
      var audioCtx = null;

      function playSound(type) {
        if (soundMuted) return;
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'x') {
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08); // A5
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
          } else if (type === 'o') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
            osc.frequency.exponentialRampToValueAtTime(554.37, audioCtx.currentTime + 0.1); // C#5
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          } else if (type === 'win') {
            var now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.12); // G5
            osc.frequency.setValueAtTime(1046.50, now + 0.18); // C6
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 0.18);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start();
            osc.stop(now + 0.3);
          } else if (type === 'lose') {
            var now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(349.23, now); // F4
            osc.frequency.setValueAtTime(311.13, now + 0.12); // Eb4
            osc.frequency.setValueAtTime(261.63, now + 0.24); // C4
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 0.24);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start();
            osc.stop(now + 0.4);
          } else if (type === 'draw') {
            var now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(392.00, now); // G4
            osc.frequency.setValueAtTime(392.00, now + 0.08);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
          } else if (type === 'click') {
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
          }
        } catch (e) {
          // Fail silently
        }
      }

      var WINNING_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];

      function checkWin(boardState, player) {
        for (var i = 0; i < WINNING_COMBOS.length; i++) {
          var combo = WINNING_COMBOS[i];
          if (boardState[combo[0]] === player && 
              boardState[combo[1]] === player && 
              boardState[combo[2]] === player) {
            return combo;
          }
        }
        return null;
      }

      function checkDraw(boardState) {
        return boardState.every(function(cell) { return cell !== null; });
      }

      function minimax(boardState, depth, isMaximizing) {
        if (checkWin(boardState, 'O')) return 10 - depth;
        if (checkWin(boardState, 'X')) return depth - 10;
        if (checkDraw(boardState)) return 0;

        if (isMaximizing) {
          var bestScore = -Infinity;
          for (var i = 0; i < 9; i++) {
            if (boardState[i] === null) {
              boardState[i] = 'O';
              var score = minimax(boardState, depth + 1, false);
              boardState[i] = null;
              bestScore = Math.max(score, bestScore);
            }
          }
          return bestScore;
        } else {
          var bestScore = Infinity;
          for (var i = 0; i < 9; i++) {
            if (boardState[i] === null) {
              boardState[i] = 'X';
              var score = minimax(boardState, depth + 1, true);
              boardState[i] = null;
              bestScore = Math.min(score, bestScore);
            }
          }
          return bestScore;
        }
      }

      function getBestMove(boardState) {
        if (difficulty === 'easy') {
          // Easy mode: 50% chance of random, 50% optimal
          if (Math.random() < 0.5) {
            var available = [];
            for (var i = 0; i < 9; i++) {
              if (boardState[i] === null) available.push(i);
            }
            if (available.length > 0) {
              return available[Math.floor(Math.random() * available.length)];
            }
          }
        }

        // Hard/Minimax mode
        var bestScore = -Infinity;
        var move = -1;
        for (var i = 0; i < 9; i++) {
          if (boardState[i] === null) {
            boardState[i] = 'O';
            var score = minimax(boardState, 0, false);
            boardState[i] = null;
            if (score > bestScore) {
              bestScore = score;
              move = i;
            }
          }
        }
        return move;
      }

      function handleCellClick(e) {
        var cellIndex = parseInt(e.currentTarget.getAttribute('data-index'));
        if (board[cellIndex] !== null || !isGameActive || currentPlayer !== 'X') return;

        makeMove(cellIndex, 'X');
      }

      function makeMove(index, player) {
        board[index] = player;
        var cell = cells[index];
        cell.disabled = true;
        
        if (player === 'X') {
          cell.innerHTML = '<svg class="cell-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
          playSound('x');
          
          var winCombo = checkWin(board, 'X');
          if (winCombo) {
            endGame('X', winCombo);
          } else if (checkDraw(board)) {
            endGame('draw');
          } else {
            currentPlayer = 'O';
            updateTurnIndicator();
            setTimeout(aiMove, 600); // Add a small delay to simulate AI thinking
          }
        } else {
          cell.innerHTML = '<svg class="cell-o" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle></svg>';
          playSound('o');
          
          var winCombo = checkWin(board, 'O');
          if (winCombo) {
            endGame('O', winCombo);
          } else if (checkDraw(board)) {
            endGame('draw');
          } else {
            currentPlayer = 'X';
            updateTurnIndicator();
          }
        }
      }

      function aiMove() {
        if (!isGameActive) return;
        var bestMove = getBestMove(board);
        if (bestMove !== -1) {
          makeMove(bestMove, 'O');
        }
      }

      function updateTurnIndicator() {
        if (currentPlayer === 'X') {
          gameStatus.textContent = 'Your turn (X)';
        } else {
          gameStatus.textContent = 'AI thinking...';
        }
      }

      function endGame(result, winCombo) {
        isGameActive = false;

        if (result === 'X') {
          gameStatus.textContent = 'You Win!';
          scores.X++;
          scorePlayerEl.textContent = scores.X;
          highlightWin(winCombo);
          playSound('win');
        } else if (result === 'O') {
          gameStatus.textContent = 'AI Wins!';
          scores.O++;
          scoreAiEl.textContent = scores.O;
          highlightWin(winCombo);
          playSound('lose');
        } else {
          gameStatus.textContent = "It's a draw!";
          scores.ties++;
          scoreTiesEl.textContent = scores.ties;
          playSound('draw');
        }
      }

      function highlightWin(combo) {
        for (var i = 0; i < combo.length; i++) {
          cells[combo[i]].classList.add('winning-cell');
        }
      }

      function resetGame() {
        playSound('click');
        board.fill(null);
        isGameActive = true;
        currentPlayer = 'X';
        updateTurnIndicator();
        
        for (var i = 0; i < cells.length; i++) {
          cells[i].innerHTML = '';
          cells[i].disabled = false;
          cells[i].classList.remove('winning-cell');
        }
      }

      // Event listeners for game
      for (var i = 0; i < cells.length; i++) {
        cells[i].addEventListener('click', handleCellClick);
      }

      resetBtn.addEventListener('click', resetGame);

      diffEasy.addEventListener('click', function() {
        if (difficulty === 'easy') return;
        playSound('click');
        difficulty = 'easy';
        diffEasy.classList.add('active');
        diffHard.classList.remove('active');
        resetGame();
      });

      diffHard.addEventListener('click', function() {
        if (difficulty === 'hard') return;
        playSound('click');
        difficulty = 'hard';
        diffHard.classList.add('active');
        diffEasy.classList.remove('active');
        resetGame();
      });

      soundToggle.addEventListener('click', function() {
        soundMuted = !soundMuted;
        if (soundMuted) {
          soundOnIcon.style.display = 'none';
          soundOffIcon.style.display = 'block';
        } else {
          soundOnIcon.style.display = 'block';
          soundOffIcon.style.display = 'none';
          playSound('click');
        }
      });
    })();
  </script>
</body>
</html>
