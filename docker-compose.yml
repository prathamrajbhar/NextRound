# NextRound Platform - Multi-platform Docker Compose
# Compatible across linux/amd64 and linux/arm64 (macOS Apple Silicon, Linux, Windows WSL2)

services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nextround-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nextround-network

  # ---------------------------------------------------------------------------
  # In-Memory Store & Queue Broker: Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nextround-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nextround-network

  # ---------------------------------------------------------------------------
  # Local S3 Object Storage: LocalStack
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: nextround-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nextround-network

  # ---------------------------------------------------------------------------
  # AI Service: FastAPI, LangGraph, LLM Integrations
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: nextround-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_PORT: 8000
      AI_HOST: 0.0.0.0
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-production}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internal_secret_key_change_in_production}
      API_BASE_URL: http://api:4000/api/v1
      REDIS_URL: redis://redis:6379
      LOCAL_REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-nextroundbucket}
      PROFILE_SCRAPER_BASE_URL: ${PROFILE_SCRAPER_BASE_URL:-http://host.docker.internal:18273}
      PROFILE_SCRAPER_TIMEOUT_MS: ${PROFILE_SCRAPER_TIMEOUT_MS:-90000}
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nextround-network

  # ---------------------------------------------------------------------------
  # Backend API & Workers: Node.js Express, BullMQ, Prisma
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nextround-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:123456789@postgres:5432/postgres}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:123456789@postgres:5432/postgres}
      REDIS_URL: redis://redis:6379
      LOCAL_REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-access-secret-at-least-16-chars}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-your-jwt-refresh-secret-at-least-16-chars}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internal_secret_key_change_in_production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_BASE_URL: http://ai-service:8000
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-nextroundbucket}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@nextround.ai}
      PROFILE_SCRAPER_BASE_URL: ${PROFILE_SCRAPER_BASE_URL:-http://host.docker.internal:18273}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nextround-network

  # ---------------------------------------------------------------------------
  # Frontend Web App: Next.js 16
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_AI_BASE_URL: ${NEXT_PUBLIC_AI_BASE_URL:-http://localhost:8000}
    container_name: nextround-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_AI_BASE_URL: ${NEXT_PUBLIC_AI_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nextround-network

# -----------------------------------------------------------------------------
# Named Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  localstack_data:
    driver: local

networks:
  nextround-network:
    driver: bridge
